name: Streamlit App CI & Health Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax and Compile Check
        run: |
          python -m py_compile app.py
          python -m py_compile streamlit_app.py
      - name: Smoke test Streamlit Headless Startup
        run: |
          python -c "import streamlit, pandas, altair, plotly; print('All core modules import cleanly')"
